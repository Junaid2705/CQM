# ===================================================================
# Resolvia Application Backend Configuration
# ===================================================================
spring.application.name=resolvia-cqm-backend
server.port=8080

# ===================================================================
# MySQL Database Connection Configuration
# ===================================================================
# Creates the database automatically if it does not already exist
spring.datasource.url=jdbc:mysql://localhost:3306/resolvia_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Spring Data JPA & Hibernate Configuration
# ===================================================================
# Auto-updates database schema based on JPA Entities without deleting existing records
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Print formatted SQL queries in console for development & debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Keep open session in view disabled for performance best practices
spring.jpa.open-in-view=false

# ===================================================================
# HikariCP Connection Pool Settings
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000


# ===================================================================
# JWT (JSON Web Token) Security Configuration
# ===================================================================
# 256-bit Hex secret key for HS256 HMAC-SHA algorithm
resolvia.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity: 24 hours (86,400,000 milliseconds)
resolvia.jwt.expiration-ms=86400000

# ===================================================================
# CORS Configuration
# ===================================================================
resolvia.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
